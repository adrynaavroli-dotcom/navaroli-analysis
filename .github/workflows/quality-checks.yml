name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, regression, VOL-005 and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Record checked commit
        run: echo "Checked commit $GITHUB_SHA"
      - name: TypeScript (app and node, no emit)
        run: bun run typecheck
      - name: Full Vitest suite
        if: ${{ !cancelled() }}
        run: bunx --no-install vitest run
      - name: VOL-005 benchmark and observed-record reproduction
        if: ${{ !cancelled() }}
        run: bun validation/run-vol005.ts
      - name: Production build (no deployment)
        if: ${{ !cancelled() }}
        run: bun run build