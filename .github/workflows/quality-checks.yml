name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, regression, VOL-003/VOL-004/VOL-005 and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Record checked commit
        run: echo "Checked commit $GITHUB_SHA"
      - name: TypeScript (app and node, no emit)
        run: bun run typecheck
      - name: Full Vitest suite
        if: ${{ !cancelled() }}
        run: bunx --no-install vitest run
      - name: VOL-003 independent benchmark runner
        # Regression gate for the upstream model whose fitted solution is the
        # nested GJR candidate. Runs in the disposable CI checkout only; its
        # regenerated output is never committed or used to refresh evidence.
        if: ${{ !cancelled() }}
        run: bun validation/run-vol003.ts
      - name: VOL-005 benchmark and observed-record reproduction
        if: ${{ !cancelled() }}
        run: bun validation/run-vol005.ts
      - name: VOL-004 benchmark vs approved arch fixture
        if: ${{ !cancelled() }}
        run: bun validation/run-vol004.ts
      - name: POR-001 benchmark vs approved numpy/scipy fixture + observed walk-forward reproduction
        if: ${{ !cancelled() }}
        run: bun validation/run-por001.ts
      - name: FND-001 M1.1 hash vectors (Python vs TypeScript, TH-F/TH-J)
        if: ${{ !cancelled() }}
        run: bash validation/fnd001/hash-vectors.sh
      - name: Production build (no deployment)
        if: ${{ !cancelled() }}
        run: bun run build
  fnd001-db:
    name: FND-001 M1.1 database and access tests (ephemeral Supabase stack)
    # Isolated by construction: a throwaway Supabase stack inside the runner. No
    # secret, no connection to the live project; every script refuses non-loopback
    # targets (validation/fnd001/lib/guard.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Record checked commit
        run: echo "Checked commit $GITHUB_SHA"
      - name: Migration chain guards (single source of truth)
        run: bash validation/fnd001/check-migration-chain.sh
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start ephemeral Supabase stack (PostgreSQL 17)
        run: bash validation/fnd001/ci/start-stack.sh
      - name: Rebuild schema from the migration chain
        run: |
          bash validation/fnd001/apply-chain.sh
          psql "$FND001_TEST_DB_URL" -X -q -c "NOTIFY pgrst, 'reload schema'"
          sleep 3
      - name: Catalog fingerprint of the rebuilt schema (drift baseline)
        run: |
          mkdir -p fnd001-evidence
          psql "$FND001_TEST_DB_URL" -X -f validation/fnd001/sql/catalog-fingerprint.sql > fnd001-evidence/catalog-fingerprint.txt
          wc -l fnd001-evidence/catalog-fingerprint.txt
      - name: T1–T33 database portion (BEGIN … ROLLBACK, zero rows left)
        run: bash validation/fnd001/run-db-tests.sh 2>&1 | tee fnd001-evidence/db-tests.txt; exit ${PIPESTATUS[0]}
      - name: T20/T21 with real JWTs through the REST API
        if: ${{ !cancelled() }}
        run: bun validation/fnd001/access-check.ts 2>&1 | tee fnd001-evidence/access-check.txt; exit ${PIPESTATUS[0]}
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fnd001-m11-evidence
          path: fnd001-evidence/
