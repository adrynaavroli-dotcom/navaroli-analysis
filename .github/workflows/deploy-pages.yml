name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: "https://zhhagwrgufwamqvjaoip.supabase.co"
          VITE_SUPABASE_PROJECT_ID: "zhhagwrgufwamqvjaoip"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoaGFnd3JndWZ3YW1xdmphb2lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1OTM3MzEsImV4cCI6MjA4MjE2OTczMX0.Q_glr9oaoIF-oS43Xel3qMzE0fx5o9IReyvqjoYZCbQ"
        run: bun run build

      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
